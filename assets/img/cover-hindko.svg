<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" width="800" height="760" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1119"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2e9a" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ff2e9a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="hk-matrix">
      <rect x="220" y="232" width="360" height="360"/>
    </clipPath>
    <linearGradient id="hk-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38e8ff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#38e8ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#38e8ff" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes hk-scan {
        0% { transform: translateY(0); opacity: 0; }
        8%, 84% { opacity: 1; }
        100% { transform: translateY(290px); opacity: 0; }
      }

      @keyframes hk-key {
        0%, 100% { opacity: 0.12; }
        45% { opacity: 0.55; }
      }

      @keyframes hk-rule {
        0% { stroke-dashoffset: 1; }
        7% { stroke-dashoffset: 0; }
        93% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 1; }
      }

      .hk-scan {
        animation: hk-scan 7.4s cubic-bezier(0.45, 0, 0.3, 1) infinite;
      }

      .hk-key {
        fill: #38e8ff;
        animation: hk-key 5.4s ease-in-out infinite;
      }

      .hk-key:nth-child(2) { animation-delay: -0.675s; }
      .hk-key:nth-child(3) { animation-delay: -1.35s; }
      .hk-key:nth-child(4) { animation-delay: -2.025s; }
      .hk-key:nth-child(5) { animation-delay: -2.7s; }
      .hk-key:nth-child(6) { animation-delay: -3.375s; }
      .hk-key:nth-child(7) { animation-delay: -4.05s; }
      .hk-key:nth-child(8) { animation-delay: -4.725s; }

      .hk-rule {
        stroke-dasharray: 1;
        animation: hk-rule 9s linear infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .hk-scan, .hk-key, .hk-rule {
          animation: none;
        }

        .hk-scan {
          opacity: 0;
        }

        .hk-key {
          opacity: 0;
        }

        .hk-rule {
          stroke-dashoffset: 0;
        }
      }
    </style>
  </defs>

  <rect width="800" height="760" fill="url(#bg)"/>
  <rect width="800" height="760" fill="url(#grid)"/>
  <circle cx="400" cy="420" r="290" fill="url(#glow)"/>

  <!-- Hindko wordmark -->
