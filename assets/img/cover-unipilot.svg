<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1119"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d8bff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff2e9a" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3d8bff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3d8bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <style>
      @keyframes up-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes up-spin-rev {
        to { transform: rotate(-360deg); }
      }

      @keyframes up-flow {
        to { stroke-dashoffset: -20; }
      }

      @keyframes up-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.022); }
      }

      @keyframes up-echo {
        0% { transform: scale(0.86); opacity: 0.5; }
        75%, 100% { transform: scale(1.55); opacity: 0; }
      }

      @keyframes up-node {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }

      @keyframes up-blink {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }

      .up-orbit {
        transform-box: view-box;
        transform-origin: 400px 500px;
      }

      .up-orbit--a { animation: up-spin 30s linear infinite; }
      .up-orbit--b { animation: up-spin-rev 44s linear infinite; }

      .up-conn {
        stroke-dasharray: 4 10;
        animation: up-flow 1.9s linear infinite;
      }

      .up-core {
        transform-box: fill-box;
        transform-origin: center;
        animation: up-breathe 6s ease-in-out infinite;
      }

      .up-echo {
        transform-box: fill-box;
        transform-origin: center;
        animation: up-echo 5.5s ease-out infinite;
      }

      .up-dot circle {
        animation: up-node 3.6s ease-in-out infinite;
      }

      .up-dot circle:nth-child(2n) { animation-delay: -1.2s; }

      .up-pipe {
        animation: up-flow 2.4s linear infinite;
      }

      .up-blink {
        animation: up-blink 2.8s ease-in-out infinite;
      }

      .up-blink--late { animation-delay: -1.4s; }

      @media (prefers-reduced-motion: reduce) {
        .up-orbit--a, .up-orbit--b, .up-conn, .up-core, .up-echo,
        .up-dot circle, .up-pipe, .up-blink {
          animation: none;
        }

        .up-echo {
          opacity: 0;
        }
      }
    </style>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#grid)"/>
  <circle cx="400" cy="500" r="330" fill="url(#glow)"/>

  <!-- orbit rings -->
  <g stroke="#ff2e9a" stroke-opacity="0.2" stroke-width="1.1" stroke-dasharray="3 7">
    <circle class="up-orbit up-orbit--a" cx="400" cy="500" r="150"/>
    <circle class="up-orbit up-orbit--b" cx="400" cy="500" r="205"/>
  </g>

  <!-- connectors -->
  <g stroke="#3d8bff" stroke-opacity="0.3" stroke-width="1.3">
    <path d="M370 280 L400 435"/>
    <path d="M430 280 L400 435"/>
    <path d="M370 720 L400 565"/>
    <path d="M430 720 L400 565"/>
  </g>

  <g class="up-conn" stroke="#38e8ff" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round">
    <path d="M370 280 L400 435"/>
    <path d="M430 280 L400 435"/>
    <path d="M370 720 L400 565"/>
    <path d="M430 720 L400 565"/>
  </g>

  <!-- module cards -->
  <g>
    <rect x="60" y="130" width="310" height="150" rx="14" fill="#0d1219" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="84" y="166" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="2" fill="#3d8bff">01 · SCHEDULER</text>
    <text x="84" y="204" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#f4f6f8">A* + CSP</text>
    <text x="84" y="236" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.1" fill="#788392">weekly plan · no clashes</text>
  </g>
  <g>
    <rect x="430" y="130" width="310" height="150" rx="14" fill="#0d1219" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="454" y="166" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="2" fill="#ff2e9a">02 · WELLBEING</text>
    <text x="454" y="204" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#f4f6f8">RF / XGBoost</text>
    <text x="454" y="236" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.1" fill="#788392">early risk signal</text>
  </g>
  <g>
    <rect x="60" y="720" width="310" height="150" rx="14" fill="#0d1219" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="84" y="756" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="2" fill="#ff2e9a">03 · GPA</text>
    <text x="84" y="794" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#f4f6f8">Gradient Boosting</text>
    <text x="84" y="826" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.1" fill="#788392">semester forecast</text>
  </g>
  <g>
    <rect x="430" y="720" width="310" height="150" rx="14" fill="#0d1219" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="454" y="756" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="2" fill="#3d8bff">04 · RULES</text>
    <text x="454" y="794" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#f4f6f8">RAG + FAISS</text>
    <text x="454" y="826" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.1" fill="#788392">answers from PDFs</text>
  </g>

  <!-- core -->
  <circle class="up-echo" cx="400" cy="500" r="128" stroke="#3d8bff" stroke-opacity="0.28" stroke-width="1.2" fill="none"/>
  <g class="up-core">
    <rect x="268" y="428" width="264" height="144" rx="18" fill="url(#core)" stroke="#3d8bff" stroke-opacity="0.55"/>
    <text x="400" y="472" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#f4f6f8">UniPilot</text>
    <text x="400" y="500" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="2.2" fill="#7cc4ff">FASTAPI</text>
    <text x="400" y="526" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="9.5" letter-spacing="1.3" fill="#a7b0bd">shared profile</text>
    <text x="400" y="552" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="9.5" letter-spacing="1.3" fill="#788392">browser · :8000</text>
  </g>
  <g class="up-dot" fill="#3d8bff">
    <circle cx="268" cy="452" r="3.4"/>
    <circle cx="532" cy="452" r="3.4"/>
    <circle cx="268" cy="548" r="3.4"/>
    <circle cx="532" cy="548" r="3.4"/>
  </g>

  <!-- pipeline line -->
  <path class="up-pipe" d="M400 572v130" stroke="#ffffff" stroke-opacity="0.14" stroke-dasharray="4 6"/>
  <g>
    <rect x="292" y="702" width="216" height="42" rx="9" fill="#0d1219" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle class="up-blink" cx="312" cy="723" r="3.2" fill="#3d8bff" fill-opacity="0.7"/>
    <circle class="up-blink up-blink--late" cx="327" cy="723" r="3.2" fill="#ff2e9a" fill-opacity="0.55"/>
    <text x="344" y="727" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.3" fill="#a7b0bd">student_profile.json</text>
  </g>

  <g font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="2.2" fill="#788392">
    <text x="42" y="48">SYSTEM / UNIPILOT</text>
    <text x="758" y="48" text-anchor="end" fill="#ff2e9a">RENDER</text>
  </g>
</svg>
