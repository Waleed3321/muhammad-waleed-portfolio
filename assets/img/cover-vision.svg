    <path d="M250 400H550"/>
    <path d="M282 300 Q400 392 518 300"/>
    <path d="M282 500 Q400 408 518 500"/>
    <path d="M306 348 Q400 400 494 348"/>
    <path d="M330 470 Q400 424 470 470"/>
