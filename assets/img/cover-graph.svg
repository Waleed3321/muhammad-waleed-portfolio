<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1119"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2e9a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff2e9a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <style>
      @keyframes kg-flow {
        to { stroke-dashoffset: -24; }
      }

      @keyframes kg-node {
        0%, 100% { opacity: 0.55; transform: scale(0.86); }
        50% { opacity: 1; transform: scale(1.2); }
      }

      @keyframes kg-ring {
        0%, 100% { stroke-opacity: 0.4; transform: scale(0.97); }
        50% { stroke-opacity: 0.75; transform: scale(1.04); }
      }

      @keyframes kg-sonar {
        0% { transform: scale(1); opacity: 0.7; }
        70%, 100% { transform: scale(2.8); opacity: 0; }
      }

      .kg-flow {
        stroke-dasharray: 3 9;
        animation: kg-flow 1.8s linear infinite;
      }

      .kg-nodes circle {
        transform-box: fill-box;
        transform-origin: center;
        animation: kg-node 4.4s ease-in-out infinite;
      }

      .kg-nodes circle:nth-child(2n) {
        animation-delay: -1.4s;
        animation-duration: 5.2s;
      }

      .kg-nodes circle:nth-child(3n) {
        animation-delay: -2.5s;
        animation-duration: 3.8s;
      }

      .kg-rings circle {
        transform-box: fill-box;
        transform-origin: center;
        animation: kg-ring 6s ease-in-out infinite;
      }

      .kg-rings circle:nth-child(2n) {
        animation-delay: -2.2s;
        animation-duration: 7s;
      }

      .kg-sonar {
        transform-box: fill-box;
        transform-origin: center;
        animation: kg-sonar 3.6s ease-out infinite;
      }

      .kg-sonar--late {
        animation-delay: -1.8s;
      }

      @media (prefers-reduced-motion: reduce) {
        .kg-flow, .kg-nodes circle, .kg-rings circle, .kg-sonar {
          animation: none;
        }

        .kg-sonar {
          opacity: 0;
        }
      }
    </style>
  </defs>

  <rect width="800" height="520" fill="url(#bg)"/>
  <rect width="800" height="520" fill="url(#grid)"/>
  <circle cx="430" cy="270" r="240" fill="url(#glow)"/>

  <g fill="none" stroke="#38e8ff">
    <circle class="kg-sonar" cx="450" cy="300" r="16" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle class="kg-sonar kg-sonar--late" cx="450" cy="300" r="16" stroke-opacity="0.4" stroke-width="1.2"/>
  </g>

  <g stroke="#ff2e9a" stroke-opacity="0.28" stroke-width="1.2">
    <path d="M210 340 L330 220 L450 300 L560 170 L660 250"/>
    <path d="M330 220 L400 110 L560 170"/>
    <path d="M450 300 L520 400 L650 360 L660 250"/>
    <path d="M210 340 L300 430 L520 400"/>
    <path d="M300 430 L400 300 L330 220"/>
    <path d="M400 300 L450 300"/>
    <path d="M400 110 L450 300"/>
    <path d="M560 170 L520 400"/>
  </g>

  <g class="kg-flow" stroke="#38e8ff" stroke-opacity="0.42" stroke-width="1.25" stroke-linecap="round">
    <path d="M210 340 L330 220 L450 300 L560 170 L660 250"/>
    <path d="M330 220 L400 110 L560 170"/>
    <path d="M450 300 L520 400 L650 360 L660 250"/>
    <path d="M210 340 L300 430 L520 400"/>
    <path d="M300 430 L400 300 L330 220"/>
    <path d="M400 300 L450 300"/>
    <path d="M400 110 L450 300"/>
    <path d="M560 170 L520 400"/>
  </g>

  <g class="kg-rings" fill="#0a0e14" stroke="#ff2e9a" stroke-width="1.5">
    <circle cx="210" cy="340" r="9"/>
    <circle cx="330" cy="220" r="9"/>
    <circle cx="450" cy="300" r="9"/>
    <circle cx="560" cy="170" r="9"/>
    <circle cx="660" cy="250" r="9"/>
    <circle cx="400" cy="110" r="9"/>
    <circle cx="520" cy="400" r="9"/>
    <circle cx="650" cy="360" r="9"/>
    <circle cx="300" cy="430" r="9"/>
    <circle cx="400" cy="300" r="9"/>
  </g>

  <g class="kg-nodes" fill="#ff2e9a">
    <circle cx="210" cy="340" r="3.2"/>
    <circle cx="330" cy="220" r="3.2"/>
    <circle cx="560" cy="170" r="3.2"/>
    <circle cx="650" cy="360" r="3.2"/>
    <circle cx="400" cy="110" r="3.2"/>
  </g>

  <g fill="#3d8bff">
    <circle cx="450" cy="300" r="13" fill-opacity="0.16"/>
    <circle cx="450" cy="300" r="7"/>
  </g>

  <g font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="2.2" fill="#788392">
    <text x="42" y="48">NLP / KNOWLEDGE GRAPH</text>
    <text x="42" y="486">REBEL · NETWORKX</text>
    <text x="640" y="486" fill="#3d8bff">1–2 HOP</text>
    <text x="612" y="48" fill="#ff2e9a">ZERO-SHOT</text>
  </g>
</svg>
